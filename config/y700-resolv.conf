# Y700 Debian/chroot managed resolver baseline.
# Override only when required by a specific network with:
#   /data/local/y700-linux/resolv.conf.override
# Current mobile/hotspot acceptance on 2026-10-07 verified both Google resolvers
# while 114.114.114.114, 1.1.1.1, 9.9.9.9 and 223.5.5.5 timed out on UDP/53.
nameserver 8.8.8.8
nameserver 8.8.4.4
options timeout:1 attempts:2
