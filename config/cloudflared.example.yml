# Copy to a device-local location such as /root/.cloudflared/config.yml.
# Do not commit the real tunnel UUID or credential JSON.
tunnel: <TUNNEL_UUID>
credentials-file: /root/.cloudflared/<TUNNEL_UUID>.json

ingress:
  - hostname: <Y700_MCP_HOSTNAME>
    service: http://127.0.0.1:8788
  - service: http_status:404
