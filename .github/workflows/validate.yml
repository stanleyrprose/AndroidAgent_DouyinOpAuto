name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python
        run: |
          python -m compileall -q bridge automation apps publisher mac/production-pipeline/pipeline mac/media-export scripts/v06 tests/fault_injection

      - name: Run production-pipeline unit tests
        working-directory: mac/production-pipeline
        run: python -m unittest discover -s tests -v

      - name: Run Bridge v2 unit tests
        run: python -m unittest tests.test_bridge_v2 -v

      - name: Run Android automation safety tests
        run: python -m unittest tests.test_tiktok_generic tests.test_publish_routing tests.test_ui_failure_evidence -v

      - name: Run Y700 remote-control self-heal tests
        run: python -m unittest tests.test_cloudflared_self_heal tests.test_health_loop_supervision tests.test_tunnel_dns_hysteresis -v

      - name: Run Rev3.6 Phase 0B frozen-contract checks
        run: |
          python scripts/v06/semantic-vectors.py
          python scripts/v06/fingerprint-profiles.py
          python scripts/v06/catalog-overlay-policy.py
          python scripts/v06/capability-readiness.py
          python scripts/v06/claim-session-reconcile.py
          python scripts/v06/ui-mutation-inventory.py
          python scripts/v06/presshome-back-migration.py
          python scripts/v06/subjob-provenance.py
          python -m unittest discover -s tests/fault_injection -v

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find bridge scripts bootstrap mac/production-pipeline/scripts -type f -name '*.sh' -print0)

      - name: Reject private deployment identifiers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '(/Users/|BEGIN (OPENSSH|RSA|EC) PRIVATE KEY|Authorization: Bearer)' -- .             ':(exclude).github/workflows/validate.yml'; then
            echo "Private/deployment-specific material detected"
            exit 1
          fi
